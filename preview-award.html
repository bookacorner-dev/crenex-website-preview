<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crenex award preview</title>
</head>
<body>
<script>
(async () => {
  const response = await fetch('./index.html', { cache: 'no-store' });
  let html = await response.text();

  const styles = `
<style>
  .mri-award-spotlight{
    position:relative;
    overflow:hidden;
    background:#f4efe6;
    border-bottom:1px solid rgba(13,19,32,.10);
  }
  .mri-award-spotlight:before{
    content:"";
    position:absolute;
    width:680px;
    height:680px;
    right:-150px;
    top:-210px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(131,220,246,.18) 0%,rgba(49,95,189,.07) 42%,rgba(49,95,189,0) 70%);
    pointer-events:none;
  }
  .mri-award-shell{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns:minmax(0,1.2fr) minmax(360px,.8fr);
    gap:56px;
    align-items:center;
    padding:58px 0 62px;
  }
  .mri-award-copy .eyebrow{margin-bottom:18px;}
  .mri-award-copy h2{
    max-width:760px;
    font-size:clamp(36px,4.3vw,58px);
  }
  .mri-award-copy .lead{
    margin-top:20px;
    max-width:650px;
    font-size:18px;
  }
  .mri-award-copy .text-link{
    display:inline-block;
    margin-top:22px;
    color:#315fbd;
    font-size:14px;
    font-weight:820;
  }
  .mri-award-object{
    position:relative;
    min-height:360px;
    display:grid;
    place-items:center;
    isolation:isolate;
  }
  .mri-award-object:before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.92) 0%,rgba(255,255,255,.58) 46%,rgba(255,255,255,0) 72%);
    z-index:-2;
  }
  .mri-award-object:after{
    content:"";
    position:absolute;
    width:250px;
    height:34px;
    bottom:26px;
    border-radius:50%;
    background:rgba(7,17,38,.14);
    filter:blur(18px);
    z-index:-1;
  }
  .mri-award-trophy{
    display:block;
    width:min(100%,470px);
    height:auto;
    filter:drop-shadow(0 24px 34px rgba(7,17,38,.17));
    transform:rotate(1.5deg);
  }
  .mri-award-micro{
    position:absolute;
    right:0;
    top:26px;
    padding:9px 12px;
    border-radius:999px;
    background:rgba(255,255,255,.84);
    border:1px solid rgba(13,19,32,.08);
    box-shadow:0 12px 30px rgba(7,17,38,.08);
    color:#566176;
    font-family:"Geist Mono",monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    backdrop-filter:blur(10px);
  }
  @media(max-width:860px){
    .mri-award-shell{grid-template-columns:1fr;gap:30px;padding:46px 0 50px}
    .mri-award-object{min-height:320px}
    .mri-award-trophy{width:min(82vw,430px)}
    .mri-award-micro{right:8%;top:14px}
  }
  @media(max-width:520px){
    .mri-award-object{min-height:280px}
    .mri-award-trophy{width:min(92vw,360px)}
    .mri-award-micro{display:none}
  }
</style>`;

  const award = `
<section class="mri-award-spotlight" aria-label="MRI APAC Partner of the Year 2026">
  <div class="container mri-award-shell">
    <div class="mri-award-copy">
      <p class="eyebrow">Recognition</p>
      <h2>Named MRI Partner of the Year.</h2>
      <p class="lead">In 2026, MRI Software recognised Crenex as its APAC Partner of the Year — reflecting the strength of our partnership and the work being delivered across casual leasing operations in the region.</p>
      <a class="text-link" href="mri-integration.html">Explore our MRI partnership →</a>
    </div>
    <div class="mri-award-object">
      <span class="mri-award-micro">MRI Re:Visionary Awards · 2026</span>
      <img class="mri-award-trophy" src="assets/recognition/mri-partner-of-the-year-2026.webp" alt="MRI Re:Visionary Partner of the Year award presented to Crenex in 2026"/>
    </div>
  </div>
</section>`;

  html = html.replace('</head>', styles + '\n</head>');
  html = html.replace('<section class="section narrative">', award + '\n\n  <section class="section narrative">');

  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
