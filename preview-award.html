<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Crenex award preview</title>
</head>
<body>
<script>
(async()=>{
  const response=await fetch('./index.html',{cache:'no-store'});
  let html=await response.text();

  const styles=`<style>
    .mri-award-spotlight{
      position:relative;
      overflow:hidden;
      background:#f4efe6;
      border-bottom:1px solid rgba(13,19,32,.10)
    }
    .mri-award-shell{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:minmax(0,1.18fr) minmax(380px,.82fr);
      gap:64px;
      align-items:center;
      padding:72px 0 74px
    }
    .mri-award-copy .eyebrow{
      display:inline-flex;
      width:max-content;
      padding:10px 14px;
      border-radius:11px;
      background:#d8f3ef;
      color:#17322f;
      margin-bottom:28px
    }
    .mri-award-copy h2{
      max-width:760px;
      font-size:clamp(44px,5.4vw,78px);
      line-height:.96;
      letter-spacing:-.06em
    }
    .mri-award-copy .lead{
      margin-top:30px;
      max-width:760px;
      font-size:clamp(18px,1.9vw,24px);
      line-height:1.55;
      color:#50607c
    }
    .mri-award-copy .text-link{
      display:inline-block;
      margin-top:30px;
      color:#315fbd;
      font-size:18px;
      font-weight:820;
      letter-spacing:-.02em
    }

    .partner-lockup-wrap{
      position:relative;
      min-height:440px;
      display:grid;
      place-items:center;
      isolation:isolate
    }
    .partner-lockup-wrap:before{
      content:"";
      position:absolute;
      inset:-32px -110px -52px -36px;
      background:
        radial-gradient(circle at 72% 18%,rgba(49,95,189,.18),transparent 29%),
        radial-gradient(circle at 52% 64%,rgba(91,198,203,.16),transparent 32%),
        radial-gradient(circle at 50% 48%,rgba(255,255,255,.92),rgba(255,255,255,.35) 44%,transparent 72%);
      z-index:-3
    }
    .partner-orbit,
    .partner-orbit:before,
    .partner-orbit:after{
      position:absolute;
      border:1px solid rgba(49,95,189,.18);
      border-radius:50%;
      content:""
    }
    .partner-orbit{
      width:430px;
      height:430px;
      z-index:-2
    }
    .partner-orbit:before{
      width:330px;
      height:330px;
      left:49px;
      top:49px;
      border-color:rgba(91,198,203,.19)
    }
    .partner-orbit:after{
      width:520px;
      height:520px;
      left:-46px;
      top:-46px;
      border-color:rgba(255,255,255,.78)
    }
    .partner-award-pill{
      position:absolute;
      right:8px;
      top:0;
      z-index:4;
      padding:12px 17px;
      border-radius:999px;
      background:rgba(255,255,255,.90);
      border:1px solid rgba(13,19,32,.08);
      box-shadow:0 14px 34px rgba(7,17,38,.08);
      color:#5d6a80;
      font-family:"Geist Mono",monospace;
      font-size:11px;
      letter-spacing:.07em;
      text-transform:uppercase;
      white-space:nowrap;
      backdrop-filter:blur(12px)
    }
    .partner-lockup{
      position:relative;
      z-index:2;
      width:min(100%,470px);
      min-height:330px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:34px 36px;
    }
    .partner-logo-mri{
      width:210px;
      height:108px;
      object-fit:contain
    }
    .partner-x{
      display:grid;
      place-items:center;
      width:54px;
      height:54px;
      margin:9px 0 11px;
      border-radius:50%;
      border:1px solid rgba(13,19,32,.11);
      background:rgba(255,255,255,.72);
      color:#657086;
      font-size:32px;
      font-weight:300;
      line-height:1;
      box-shadow:0 10px 26px rgba(7,17,38,.05)
    }
    .partner-logo-crenex{
      width:245px;
      height:auto;
      object-fit:contain
    }
    .partner-recognition{
      margin-top:30px;
      text-align:center;
      color:#657086;
      font-size:14px;
      line-height:1.5
    }
    .partner-accent{
      display:flex;
      align-items:center;
      gap:10px;
      width:320px;
      max-width:90%;
      margin-top:24px
    }
    .partner-accent span:first-child{
      height:5px;
      flex:1;
      border-radius:999px;
      background:#315fbd
    }
    .partner-accent span:last-child{
      width:62px;
      height:5px;
      border-radius:999px;
      background:#55b8c2
    }

    @media(max-width:980px){
      .mri-award-shell{grid-template-columns:1fr;gap:40px;padding:58px 0 62px}
      .partner-lockup-wrap{min-height:390px}
      .partner-award-pill{right:auto;left:0}
    }
    @media(max-width:560px){
      .mri-award-copy .text-link{font-size:16px}
      .partner-lockup-wrap{min-height:350px}
      .partner-orbit{width:310px;height:310px}
      .partner-orbit:before{width:238px;height:238px;left:35px;top:35px}
      .partner-orbit:after{width:370px;height:370px;left:-31px;top:-31px}
      .partner-logo-mri{width:170px;height:88px}
      .partner-logo-crenex{width:205px}
      .partner-award-pill{font-size:10px;padding:10px 13px}
      .partner-recognition{font-size:13px}
    }
  </style>`;

  const award=`
    <section class="mri-award-spotlight" aria-label="MRI APAC Partner of the Year 2026">
      <div class="container mri-award-shell">
        <div class="mri-award-copy">
          <p class="eyebrow">Recognition</p>
          <h2>Named MRI Partner of the Year.</h2>
          <p class="lead">In 2026, MRI Software recognised Crenex as its APAC Partner of the Year — reflecting the strength of our partnership and the work being delivered across casual leasing operations in the region.</p>
          <a class="text-link" href="mri-integration.html">Explore our MRI partnership →</a>
        </div>
        <div class="partner-lockup-wrap">
          <span class="partner-award-pill">APAC Partner of the Year · 2026</span>
          <span class="partner-orbit" aria-hidden="true"></span>
          <div class="partner-lockup">
            <img class="partner-logo-mri" src="assets/logos/mri-software.png" alt="MRI Software"/>
            <span class="partner-x" aria-hidden="true">×</span>
            <img class="partner-logo-crenex" src="assets/brand/crenex-logo-ink.svg" alt="Crenex"/>
            <p class="partner-recognition">Recognised by MRI Software<br/>for partnership impact across APAC.</p>
            <div class="partner-accent" aria-hidden="true"><span></span><span></span></div>
          </div>
        </div>
      </div>
    </section>`;

  html=html.replace('</head>',styles+'\n</head>');
  html=html.replace('<section class="section narrative">',award+'\n\n  <section class="section narrative">');
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
