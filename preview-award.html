<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crenex award preview</title>
</head>
<body>
<script>
(async () => {
  const response = await fetch('./index.html', { cache: 'no-store' });
  let html = await response.text();

  const styles = `
<style>
  .mri-award-spotlight{
    position:relative;
    overflow:hidden;
    background:#f4efe6;
    border-bottom:1px solid rgba(13,19,32,.10);
  }
  .mri-award-spotlight:before{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    right:-120px;
    top:-210px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(49,95,189,.12),rgba(49,95,189,0) 68%);
    pointer-events:none;
  }
  .mri-award-shell{
    position:relative;
    display:grid;
    grid-template-columns:minmax(0,1.2fr) minmax(330px,.8fr);
    gap:56px;
    align-items:center;
    padding:58px 0 62px;
  }
  .mri-award-copy .eyebrow{
    margin-bottom:18px;
  }
  .mri-award-copy h2{
    max-width:760px;
    font-size:clamp(36px,4.3vw,58px);
  }
  .mri-award-copy .lead{
    margin-top:20px;
    max-width:650px;
    font-size:18px;
  }
  .mri-award-copy .text-link{
    display:inline-block;
    margin-top:22px;
    color:#315fbd;
    font-size:14px;
    font-weight:820;
  }
  .mri-award-object{
    position:relative;
    min-height:250px;
    display:grid;
    place-items:center;
  }
  .mri-award-card{
    position:relative;
    width:min(100%,390px);
    min-height:230px;
    padding:28px 30px;
    border-radius:30px;
    background:#071126;
    color:#fff;
    box-shadow:0 24px 60px rgba(7,17,38,.18);
    overflow:hidden;
  }
  .mri-award-card:after{
    content:"";
    position:absolute;
    width:210px;
    height:210px;
    right:-65px;
    bottom:-95px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(46,230,166,.30),rgba(46,230,166,0) 68%);
  }
  .mri-award-card-top{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
  }
  .mri-award-card-top img{
    width:108px;
    height:auto;
    filter:brightness(0) invert(1);
    opacity:.92;
  }
  .mri-award-year{
    font-family:"Geist Mono",monospace;
    font-size:12px;
    letter-spacing:.10em;
    color:#9ba7bb;
  }
  .mri-award-medal{
    position:relative;
    z-index:2;
    width:72px;
    height:72px;
    margin-top:24px;
    display:grid;
    place-items:center;
    border-radius:50%;
    border:1px solid rgba(234,223,205,.34);
    background:linear-gradient(145deg,rgba(234,223,205,.18),rgba(234,223,205,.05));
  }
  .mri-award-medal svg{
    width:34px;
    height:34px;
    fill:none;
    stroke:#eadfcd;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .mri-award-card strong{
    position:relative;
    z-index:2;
    display:block;
    margin-top:20px;
    max-width:260px;
    font-size:24px;
    line-height:1.06;
    letter-spacing:-.035em;
  }
  .mri-award-card small{
    position:relative;
    z-index:2;
    display:block;
    margin-top:10px;
    color:#9ba7bb;
    font-family:"Geist Mono",monospace;
    font-size:10px;
    letter-spacing:.09em;
    text-transform:uppercase;
  }
  .mri-award-ribbon{
    position:absolute;
    right:-14px;
    top:42px;
    z-index:3;
    transform:rotate(7deg);
    padding:10px 16px;
    border-radius:999px;
    background:#fff;
    color:#071126;
    border:1px solid #d9e2ee;
    box-shadow:0 12px 28px rgba(7,17,38,.12);
    font-family:"Geist Mono",monospace;
    font-size:10px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  @media(max-width:860px){
    .mri-award-shell{grid-template-columns:1fr;gap:34px;padding:46px 0 50px}
    .mri-award-object{justify-items:start;min-height:0}
    .mri-award-ribbon{right:auto;left:310px}
  }
  @media(max-width:520px){
    .mri-award-ribbon{display:none}
    .mri-award-card{width:100%}
  }
</style>`;

  const award = `
<section class="mri-award-spotlight" aria-label="MRI APAC Partner of the Year 2026">
  <div class="container mri-award-shell">
    <div class="mri-award-copy">
      <p class="eyebrow">Recognition</p>
      <h2>Named MRI APAC Partner of the Year.</h2>
      <p class="lead">In 2026, MRI Software recognised Crenex as its APAC Partner of the Year — reflecting the strength of our partnership and the work being delivered across casual leasing operations in the region.</p>
      <a class="text-link" href="mri-integration.html">Explore our MRI partnership →</a>
    </div>
    <div class="mri-award-object" aria-hidden="true">
      <div class="mri-award-ribbon">APAC · 2026</div>
      <div class="mri-award-card">
        <div class="mri-award-card-top">
          <img src="assets/logos/mri-software.png" alt="" width="500" height="287"/>
          <span class="mri-award-year">2026</span>
        </div>
        <div class="mri-award-medal">
          <svg viewBox="0 0 32 32">
            <path d="M10 4h12v5c0 5-2.5 8.5-6 8.5S10 14 10 9V4Z"/>
            <path d="M10 8H6v1.5c0 3.2 2.1 5.5 5.2 6.2M22 8h4v1.5c0 3.2-2.1 5.5-5.2 6.2M16 17.5V23M11.5 27h9M13 23h6v4h-6z"/>
          </svg>
        </div>
        <strong>APAC Partner<br/>of the Year</strong>
        <small>Recognised by MRI Software</small>
      </div>
    </div>
  </div>
</section>`;

  html = html.replace('</head>', styles + '\n</head>');
  html = html.replace('<section class="section narrative">', award + '\n\n  <section class="section narrative">');

  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
