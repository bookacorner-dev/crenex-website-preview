<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crenex award preview</title>
</head>
<body>
<script>
(async () => {
  const response = await fetch('./index.html', { cache: 'no-store' });
  let html = await response.text();

  const styles = `
<style>
  .mri-award-band{
    background:linear-gradient(90deg,#0a0d12,#0e131b 58%,#0c211d);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .mri-award-inner{
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    gap:18px;
    align-items:center;
    padding:18px 0 22px;
    border-top:1px solid rgba(255,255,255,.10);
  }
  .mri-award-icon{
    width:48px;
    height:48px;
    display:grid;
    place-items:center;
    border:1px solid rgba(255,255,255,.14);
    border-radius:15px;
    background:rgba(255,255,255,.05);
  }
  .mri-award-icon svg{
    width:25px;
    height:25px;
    fill:none;
    stroke:#2ee6a6;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .mri-award-copy small{
    display:block;
    margin-bottom:5px;
    color:#8b96aa;
    font-family:"Geist Mono",monospace;
    font-size:10px;
    font-weight:600;
    letter-spacing:.11em;
    text-transform:uppercase;
  }
  .mri-award-copy strong{
    display:block;
    color:#fff;
    font-size:18px;
    line-height:1.2;
    letter-spacing:-.025em;
  }
  .mri-award-copy p{
    margin-top:5px;
    color:#aab4c5;
    font-size:13px;
    line-height:1.45;
  }
  .mri-award-tag{
    white-space:nowrap;
    color:#dce4ef;
    border:1px solid rgba(255,255,255,.14);
    border-radius:999px;
    padding:9px 12px;
    font-family:"Geist Mono",monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  @media(max-width:720px){
    .mri-award-inner{grid-template-columns:auto 1fr;padding:16px 0 18px}
    .mri-award-tag{grid-column:2;justify-self:start}
  }
</style>`;

  const award = `
<section class="mri-award-band" aria-label="MRI APAC Partner of the Year 2026">
  <div class="container mri-award-inner">
    <span class="mri-award-icon" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <path d="M10 5h12v4c0 5-2.5 8.5-6 8.5S10 14 10 9V5Z"/>
        <path d="M10 8H6v1.5c0 3.2 2.1 5.5 5.2 6.2M22 8h4v1.5c0 3.2-2.1 5.5-5.2 6.2M16 17.5V23M11.5 27h9M13 23h6v4h-6z"/>
      </svg>
    </span>
    <div class="mri-award-copy">
      <small>Recognised by MRI Software</small>
      <strong>MRI APAC Partner of the Year 2026</strong>
      <p>Recognising the strength of our partnership and our impact across Asia Pacific.</p>
    </div>
    <span class="mri-award-tag">APAC · 2026</span>
  </div>
</section>`;

  html = html.replace('</head>', styles + '\n</head>');
  html = html.replace('<section class="impact-band" aria-label="Crenex at a glance">', award + '\n\n  <section class="impact-band" aria-label="Crenex at a glance">');

  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
