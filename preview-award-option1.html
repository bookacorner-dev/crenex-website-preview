-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}.lockup{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center}.logo-mri{width:205px;height:auto}.logo-crenex{width:245px;height:auto}.partner-x{display:grid;place-items:center;width:54px;height:54px;margin:18px 0;border-radius:50%;border:1px solid rgba(13,19,32,.11);background:rgba(255,255,255,.72);color:#657086;font-size:32px;box-shadow:0 10px 26px rgba(7,17,38,.05)}.recognition{margin-top:30px;text-align:center;color:#657086;font-size:14px;line-height:1.5}.accent-line{display:flex;gap:10px;width:320px;max-width:90%;margin-top:24px}.accent-line i:first-child{height:5px;flex:1;border-radius:9px;background:#315fbd}.accent-line i:last-child{width:62px;height:5px;border-radius:9px;background:#55b8c2}@media(max-width:980px){.mri-award-shell{grid-template-columns:1fr;gap:40px}.partner-wrap{min-height:390px}.award-pill{right:auto;left:0}}@media(max-width:560px){.logo-mri{width:170px}.logo-crenex{width:205px}.orbit{width:310px;height:310px}.orbit:before{width:238px;height:238px;left:35px;top:35px}.orbit:after{width:370px;height:370px;left:-31px;top:-31px}}</style>`;const a=`<section class="mri-award-spotlight"><div class="container mri-award-shell"><div class="mri-award-copy"><p class="eyebrow">Recognition</p><h2>Named MRI Partner of the Year.</h2><p class="lead">In 2026, MRI Software recognised Crenex as its APAC Partner of the Year — reflecting the strength of our partnership and the work being delivered across casual leasing operations in the region.</p><a class="text-link" href="mri-integration.html">Explore our MRI partnership →</a></div><div class="partner-wrap"><span class="award-pill">APAC Partner of the Year · 2026</span><span class="orbit"></span><div class="lockup"><img class="logo-mri" src="assets/logos/mri-software-color.svg" alt="MRI Software"><span class="partner-x">×</span><img class="logo-crenex"
