name: One-time build browser preview

on:
  push:
    branches:
      - preview/vts-style-hero
    paths:
      - .github/workflows/one-time-build-vts-browser-preview.yml

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/vts-style-hero
          fetch-depth: 0
      - name: Create standalone browser preview
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('index.html').read_text(encoding='utf-8')
          src = src.replace('<head>', '<head>\n<base href="https://crenex.io/">', 1)
          Path('hero-preview.html').write_text(src, encoding='utf-8')
          PY

          rm .github/workflows/one-time-build-vts-browser-preview.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-preview.html .github/workflows/one-time-build-vts-browser-preview.yml
          git commit -m "Add browser preview for VTS-style hero"
          git push origin preview/vts-style-hero
