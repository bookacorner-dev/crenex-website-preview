name: "Fix homepage hero rotation"

'on':
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Replace blocked inline hero script with same-origin external script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          start_marker = "<script>\n(() => {\n  const phrases = ["
          end_marker = "</script>\n<script src=\"assets/js/app.js\"></script>"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Hero inline script start marker not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('Hero inline script end marker not found')
          replacement = '<script src="assets/js/hero-rotation.js" defer></script>\n'
          text = text[:start] + replacement + text[end + len('</script>\n'):]
          path.write_text(text)
          PY

      - name: Commit hero animation fix and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-time-fix-hero-rotation.yml
          git add index.html .github/workflows/one-time-fix-hero-rotation.yml
          git commit -m "Fix homepage hero rotation under CSP"
          git push origin HEAD:main
