name: Promote VTS homepage hero

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Copy approved hero version and self-clean
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin preview/vts-style-hero
          git checkout origin/preview/vts-style-hero -- index.html
          git rm .github/workflows/one-time-promote-vts-hero.yml
          git add index.html
          git commit -m "Promote VTS-style homepage hero"
          git push origin HEAD:main
