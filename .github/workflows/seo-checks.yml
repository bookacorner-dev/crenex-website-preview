name: SEO integrity checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check canonical URLs, sitemap, links and robots
        run: python3 docs/check_seo.py
      - name: Check shared JavaScript syntax
        run: node --check assets/js/app.js
