# ─────────────────────────────────────────────────────────────────────────────
# [CD] Publica el sitio estático a producción (crenex.io / Hostinger).
#   push/merge a main → espeja el sitio a la branch `build` (strippeando docs/,
#   .github/, .claude/, README) → Hostinger (Git deploy conectado a `build`)
#   publica a public_html por webhook.
# Sin build step: el repo ya es HTML/CSS/JS final. Runbook: docs/deploy-runbook.md
# ─────────────────────────────────────────────────────────────────────────────
name: "[CD] 🚀 Deploy · publish to build (Hostinger)"
run-name: "Deploy build · ${{ github.sha }} · @${{ github.actor }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-build
  cancel-in-progress: true

env:
  DEPLOY_BRANCH: build
  BUNDLE_DIR: _bundle

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Arma el bundle publicable (strip repo-only) y lo espeja a la branch `build`.
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Armar bundle desplegable (strip archivos repo-only)
        run: |
          mkdir -p "$BUNDLE_DIR"
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude 'docs' \
            --exclude 'README.md' \
            --exclude "$BUNDLE_DIR" \
            ./ "$BUNDLE_DIR"/

          # Los assets se cachean durante meses en producción. Versionar sus URLs
          # en cada deploy evita que el navegador siga mostrando CSS, JS o capturas antiguas.
          ASSET_VERSION="${GITHUB_SHA::12}"
          while IFS= read -r -d '' html_file; do
            sed -i \
              -e "s|assets/css/styles.css|assets/css/styles.css?v=${ASSET_VERSION}|g" \
              -e "s|assets/js/app.js|assets/js/app.js?v=${ASSET_VERSION}|g" \
              "$html_file"

            for screen in dashboard bookings messages occupancy billing performance listing; do
              sed -i \
                "s|assets/screens/${screen}.png|assets/screens/${screen}.png?v=${ASSET_VERSION}|g" \
                "$html_file"
            done
          done < <(find "$BUNDLE_DIR" -type f -name '*.html' -print0)

          echo "Versión de assets: $ASSET_VERSION"
          echo "Contenido del bundle:"; find "$BUNDLE_DIR" -maxdepth 1 | sort

      - name: Publicar bundle → branch ${{ env.DEPLOY_BRANCH }}
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: ${{ env.DEPLOY_BRANCH }}
          FOLDER: ${{ env.BUNDLE_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Deploy build: ({sha}) {msg}"
